name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name barro_tv --org com.kounadia .
      - run: grep -q INTERNET android/app/src/main/AndroidManifest.xml || sed -i "s#<application#<uses-permission android:name=\"android.permission.INTERNET\"/><application#" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: barro-tv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
