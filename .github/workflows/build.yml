name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android --project-name barro_tv --org com.kounadia .

      - name: Preparer Android (nom, superposition, ouvrir avec Barro Play)
        run: python3 outils/preparer_android.py

      - run: flutter pub get

      - name: Icone de l'application
        run: dart run flutter_launcher_icons

      - name: Compilation (3 essais en cas de coupure reseau)
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Nouvel essai dans 20 secondes..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: barro-tv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
